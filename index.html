<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>효돌이의 ATP 공장 - 1단계 장면</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1430;--line:#6b4fb3;--ink:#f4efff;--atp:#ffd23f}
*{box-sizing:border-box;margin:0;font-family:'DotGothic16','Courier New',monospace}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;font-size:12px;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

button{color:var(--ink);background:var(--line);border:2px solid var(--ink);padding:4px 8px;font-size:12px;cursor:pointer;box-shadow:0 3px 0 #000}

.oc{border:2px solid var(--line);background:#2a1f4a;padding:4px;margin-bottom:4px}.oc small{color:#a99bd1}.oc button{width:100%;margin-top:3px}.oc button:disabled{opacity:.4}
.tm{height:4px;background:#000;margin-top:3px}.tm i{display:block;height:100%;background:#ffd23f}
#end,#go{position:fixed;inset:0;background:rgba(10,5,25,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;z-index:9;padding:16px}#end.on,#go.on{display:flex}#end h1,#go h1{font-size:24px;color:#ffd23f}
#bub{position:absolute;right:8px;bottom:8px;max-width:280px;background:#f4efff;color:#222;border:3px solid #000;padding:6px 10px;display:none;z-index:2;line-height:1.4;font-size:12px}
#pn{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.85);border:2px solid #ffd23f;padding:6px 8px;display:none;z-index:2;max-width:250px;line-height:1.4}#pn button{margin-top:4px}.dl{color:#ffd23f;margin-top:6px;font-size:11px;border-bottom:1px solid #6b4fb3}#pn button:disabled{opacity:.4}
canvas{background:#000;image-rendering:pixelated}
</style>
</head>
<body>
<div id="bar"><b>효돌이의 ATP 공장</b><div class="pg"><div id="pgf" style="height:100%;width:0;background:#ffd23f"></div><div id="pgt" class="pgt"></div></div><div class="pg"><div id="pgf2" style="height:100%;width:0;background:#ff9ccc"></div><div id="pgt2" class="pgt"></div></div><button id="bg">포도당 구매 (2코인)</button><button id="bo">산소 +5 구매 (3코인)</button><button id="ag"></button><button id="ao"></button><button id="bs">배속 x1</button><button id="rs">다시 시작</button></div>
<div id="mid"><div id="wrap"><canvas id="c" width="960" height="440"></canvas><div id="bub"></div><div id="pn"><b id="pt"></b><div id="pd"></div><div id="pw" style="color:#ff9ab0"></div><button id="pb"></button><button id="pu"></button><div id="pdc">꾸미기 (코인이 바닥나면 게임 오버!)<div class="dl">모자</div><button id="d0"></button><button id="d1"></button><button id="d2"></button><div class="dl">얼굴</div><button id="d3"></button><button id="d4"></button></div> <button id="px">닫기</button></div></div><div id="ord"></div></div><div id="go"><h1>공장이 멈췄어요</h1><p id="got"></p><button onclick="location.reload()">다시 하기</button></div><div id="end"><h1 id="endh"></h1><p id="endt"></p><p>포도당 1분자에서 ATP 약 32개를 만들어 낸 훌륭한 공장장이었어요.</p><button onclick="location.reload()">다시 하기</button></div>
<div id="hud"></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),R=Math.random;
let E=[],st={glu:0,o2:40,atp:0,coin:150,sp:1,T:0,pros:0,ord:[],oid:0,no:5,sl:1,pk:0,sg:0,la:0,gt:0,bt:0,bm:'',sd:{},h1:0,cn:0,un:0,sh:0,hyp:0,nh:-1,fk:'젖산',fer:0,sv:0,nad:6,pend:0},gly={t:0},tca={t:0},syn={t:0,tot:0,c:0,a:0},spT=0,ang=0,last=0;
const RC=[500,310],F='11px DotGothic16,monospace';
const V={glyc:0,pdh:0,tca:0,c1:0,c2:0,q:0,c3:0,cc:0,c4:0,syn:0,ferm:0};let sel=null;
const SL={
 glyc:{n:'해당과정 효소',x:130,y:111,w:64,h:50,c:10,d:'포도당을 피루브산 2개로 쪼개요. ATP 2, NADH 2.'},
 pdh:{n:'피루브산 산화 효소',x:372,y:240,w:44,h:28,c:10,d:'피루브산을 아세틸(2C)로 바꿔요. CO₂ 1개와 NADH 1개가 나와요.'},
 tca:{n:'TCA 회로',x:500,y:310,w:104,h:104,c:15,d:'아세틸을 돌려 NADH 3, FADH₂ 1, ATP 1, CO₂ 2를 만들어요.'},
 c1:{n:'복합체 Ⅰ',x:400,y:166,w:36,h:40,c:15,d:'NADH의 전자를 받고 H⁺ 4개를 퍼 올려요.'},
 c2:{n:'복합체 Ⅱ',x:470,y:166,w:36,h:40,c:10,d:'FADH₂의 전자를 받아요. H⁺는 펌핑하지 않아요.'},
 q:{n:'유비퀴논(Q)',x:515,y:166,w:22,h:26,c:10,d:'복합체 Ⅰ·Ⅱ의 전자를 복합체 Ⅲ으로 날라요.'},
 c3:{n:'복합체 Ⅲ',x:560,y:166,w:36,h:40,c:15,d:'전자를 전달하며 H⁺ 4개를 퍼 올려요.'},
 cc:{n:'시토크롬 c',x:620,y:166,w:22,h:26,c:10,d:'복합체 Ⅲ의 전자를 복합체 Ⅳ로 날라요.'},
 c4:{n:'복합체 Ⅳ',x:680,y:166,w:36,h:40,c:20,d:'전자를 산소에 넘겨 물을 만들고 H⁺ 2개를 퍼 올려요.'},
 ferm:{n:'발효 효소',x:150,y:335,w:70,h:54,c:30,d:'산소가 없을 때 피루브산과 NADH로 NAD⁺를 되살려 해당과정을 이어가요. ATP는 늘지 않아요.'},
 syn:{n:'ATP 합성효소',x:820,y:190,w:44,h:88,c:25,d:'H⁺가 통로를 내려갈 때 ATP를 만들어요. 통로는 2개예요. 업그레이드하면 H⁺가 더 빨리 지나가요.'}};
const TIP={glyc:'해당과정 효소 설치! 포도당 1개를 피루브산 2개로 쪼개요.',pdh:'피루브산이 아세틸로 바뀌며 CO₂와 NADH가 나와요.',tca:'TCA 회로는 아세틸을 돌려 NADH와 FADH₂를 잔뜩 만들어요.',c1:'복합체 Ⅰ은 NADH의 전자를 받아 H⁺를 퍼 올려요.',c2:'복합체 Ⅱ는 FADH₂의 전자를 받아요. H⁺는 펌핑하지 않아요.',q:'유비퀴논이 전자를 복합체 Ⅲ으로 날라요.',c3:'복합체 Ⅲ도 H⁺를 퍼 올려요.',cc:'시토크롬 c가 전자를 복합체 Ⅳ로 날라요.',c4:'복합체 Ⅳ에서 전자가 산소를 만나 물이 돼요.',syn:'H⁺가 합성효소를 통과해 내려갈 때 ATP가 만들어져요.',ferm:'발효 효소는 산소가 없을 때 NAD⁺를 되살려요.'};
const DC={},DEC=[['rib','리본',25,'t'],['crown','왕관',50,'t'],['spk','반짝이',35,'t'],['blush','볼터치',30,'f'],['glass','안경',40,'f']],A={g:0,o:0},on={g:1,o:1},fm={t:0};
function add(k,x,y,p,v,d){const e={k,x,y,p:p||[],v:v||70,d,w:0,vx:R()-.5,vy:R()-.5};E.push(e);return e}
function H(x,n){for(let i=0;i<n;i++){const e=add('hp',x+R()*20-10,140,[],0);e.free=1}}
const kill=e=>e.dead=1,atpD=e=>{st.atp++;e.dead=1};
function step(e,dt){
 if(e.k=='hp'&&e.free){e.x+=e.vx*40*dt+Math.sign(tgtX(e.x)-e.x)*8*dt;e.y+=e.vy*40*dt+(146-e.y)*.4*dt;if(e.x<340||e.x>895)e.vx*=-1;if(e.y<48||e.y>148)e.vy*=-1;if(R()<.05){e.vx=R()-.5;e.vy=R()-.5}return}
 if(!e.p.length)return;const t=e.p[0],dx=t[0]-e.x,dy=t[1]-e.y,dd=Math.hypot(dx,dy),s=e.v*dt;
 if(dd<=s){e.x=t[0];e.y=t[1];e.p.shift();if(!e.p.length&&e.d){const f=e.d;e.d=null;f(e)}}else{e.x+=dx/dd*s;e.y+=dy/dd*s}}
// 해당과정: 포도당 6C -> 피루브산 3C x2
function glyOut(){fx(130,110);for(let i=0;i<2;i++){
 if(anox()){const a=add('pyr',130,112+i*14,[[60+R()*180,195+R()*60]],55);a.cy=1;const b=add('nadh',124+i*12,98,[[60+R()*180,195+R()*60]],55);b.cy=1}else{add('pyr',130,112+i*14,[[240,130+i*10],[300,138],[345,172],[372,250]],55,pyrD);
 add('nadh',124+i*12,98,[[250,235],[360,238],[400,195],[400,178]],55,nadhD)}
 add('atp',130,100,[[250,12],[930,16]],110,atpD)}}
// 피루브산 산화: 3C -> 2C(아세틸) + CO2
function pyrD(e){if(!V.pdh){e.pw=1;return}e.pw=0;e.k='ace';add('co2',e.x,e.y,[[e.x,-10]],45,kill);add('nadh',e.x+10,e.y,[[400,230],[400,178]],55,nadhD);e.p=[[430,300]];e.d=a=>{a.w=1}}
function tcaOut(){fx(RC[0],RC[1]);
 for(let i=0;i<2;i++)add('co2',RC[0]+i*24-12,RC[1]-40,[[RC[0]+i*30-15,-10]],45,kill);
 for(let i=0;i<3;i++)add('nadh',RC[0]-24+i*8,RC[1]-50,[[400,230],[400,178]],55,nadhD);
 add('fadh',RC[0]+28,RC[1]-50,[[470,230],[470,178]],55,fadD);
 add('atp',RC[0],RC[1],[[660,300],[920,300],[930,16]],100,atpD)}
// 전자전달계: NADH -> 복합체 Ⅰ(H+ 4), 복합체 Ⅲ(H+ 4), 복합체 Ⅳ(H+ 2)
const SX={syn:820},SUC=[40,70,110,160];
function tgtX(x){let b=820,d=1e9;for(const k in SX)if(V[k]&&Math.abs(SX[k]-x)<d){d=Math.abs(SX[k]-x);b=SX[k]}return b}
const anox=()=>st.o2<=0||st.cn>0;
const glyBlk=()=>anox()?st.nad<2:nhc()>=10;
const nhc=()=>E.filter(e=>e.k=='nadh'||e.k=='fadh').length;
const blocked=()=>E.filter(e=>e.k=='e'&&((e.w&&anox())||e.fw)).length>=2;
function nadhD(e){e.hold=1;e.x+=R()*30-15;e.y+=R()*36}
function fadD(e){e.hold=1;e.x+=R()*30-15;e.y+=R()*36}
const CH=[['q',515],['c3',560],['cc',620],['c4',680]];
function eSp(x,own){const e=add('e',x,170,[],70);e.i=0;e.o=own;eGo(e)}
function eGo(e){if(e.i>=4){e.w=1;return}const n=CH[e.i];if(!V[n[0]]){e.fw=1;return}e.v=70*(1+.4*(V[e.o]-1)+.4*(V[n[0]]-1));e.p=[[n[1],170]];e.d=q=>{if(n[0]=='c3')H(560,4);q.i++;eGo(q)}}
const stage=()=>Math.min(3,Math.floor(st.pros/25));
function say(m){st.bm=m;st.bt=9}
function tip(k,m){if(st.sd[k])return;st.sd[k]=1;say(m)}
const SU=['','진행도 25%! 뇌세포 손님이 찾아와요. 이제 포도당 배급이 끊길 수 있어요.','진행도 50%! 신장세포 손님이 와요. 시안화물 같은 독이 흘러들 수 있으니 조심하세요.','진행도 75%! 심장세포 손님이 와요. 막을 뚫는 짝풀림제도 나타나요.'];
function stageUp(){say(SU[stage()])}
function ordTick(dt){st.ord.forEach(o=>o.t-=dt);st.ord=st.ord.filter(o=>o.t>0);st.no-=dt;
 if(st.no<=0&&st.ord.length<3){const L=[['근육세포',20,45],['간세포',40,70]],n=stage();if(n>=1)L.push(['뇌세포',60,100]);if(n>=2)L.push(['신장세포',100,120]);if(n>=3)L.push(['심장세포',90,50]);
  const c=L[Math.floor(R()*L.length)],amt=Math.max(4,Math.round(c[1]*(1+.2*n)*(V.syn?1:.3)*(.8+R()*.4))),tm=Math.round(c[2]*(V.syn?1:1.5));st.ord.push({id:++st.oid,n:c[0],amt,t:tm,max:tm});st.no=Math.max(5,10-1.5*n)+R()*4}}
function evEnd(){st.nh=Math.max(20,48-7*stage())+R()*25;say('다시 평온해졌어요!')}
function evStart(){const L=['hyp'];if(stage()>=1)L.push('sh');if(stage()>=2)L.push('cn');if(stage()>=3)L.push('un');
 const k=st.h1?L[Math.floor(R()*L.length)]:'hyp',d=22+3*stage();st.h1=1;
 if(k=='hyp'){st.hyp=d;st.sv=st.o2;st.o2=0;st.fk='젖산';say('산소 부족 사태! 전자전달계가 멈춰요. 발효 효소로 NAD⁺를 되살려 버텨요! (사람 세포는 젖산 발효를 해요)')}
 else if(k=='sh'){st.sh=d;say('포도당 배급 지연! 포도당을 살 수 없어요. 가진 포도당으로 버티세요.')}
 else if(k=='cn'){st.cn=d;st.fk='젖산';say('시안화물 습격! 복합체 Ⅳ가 막혀 산소가 있어도 전자가 못 나가요. 발효로 버티세요!')}
 else{st.un=d;say('짝풀림제 침투! 막에 구멍이 나서 H⁺가 새요. 전자는 흘러도 ATP는 덜 만들어져요.')}}
const codi=()=>{let n=0;for(const k in SL)if(V[k]){n++;const d=DC[k];if(d){if(d.t)n++;if(d.f)n++}}return n};
function progTick(){const CT=Object.keys(SL).length*3,p=Math.max((st.coin-150)/350,codi()/CT);if(p>st.pk)st.pk=p;st.pros=Math.min(100,st.pk*100);const n=stage();if(n>st.sg){st.sg=n;stageUp()}
 const m=Math.floor(st.T/60)+'분 '+Math.floor(st.T%60)+'초';
 if(st.coin>=500)endGame('엔딩 ① 부자 공장!','코인 500개를 모았어요!',m);else if(codi()>=CT)endGame('엔딩 ② 코디 완성!','모든 시설을 설치하고 꾸미기를 마쳤어요!',m)}
function endGame(h,d,m){st.over=1;$('endh').textContent=h;$('endt').textContent=d+' 걸린 시간: '+m;$('end').classList.add('on')}
function buyO2(n,u){st.pend+=u;for(let i=0;i<n;i++){const e=add('o2',668+i*12,-10-i*16,[[684+i*3-6,60],[684,150]],110,o=>{st.o2+=u/n;st.pend-=u/n;o.dead=1});e.full=1}}
function stuckTick(dt){if(E.some(e=>e.k=='atp'))st.la=st.T;
 const bad=st.coin<2&&st.glu<1&&st.sh<=0&&!E.some(e=>e.k=='glu'||e.k=='atp')&&st.atp<16,idle=st.T-st.la;
 if(bad&&idle>6)tip('stuck','코인이 바닥났어요! 이대로 ATP를 못 만들면 공장이 멈춰요.');
 if(bad&&idle>12){st.gt+=dt;if(st.gt>3){st.over=1;$('got').textContent='걸린 시간 '+Math.floor(st.T/60)+'분 '+Math.floor(st.T%60)+'초 · 진행도 '+Math.floor(st.pros)+'%. 코인이 바닥나서 포도당을 살 수 없고, 더 만들 ATP도 없어요.';$('go').classList.add('on')}}else st.gt=0}
function hypTick(dt){
 if(st.hyp>0){st.hyp-=dt;if(st.hyp<=0){st.hyp=0;buyO2(Math.min(8,Math.max(1,Math.round(st.sv/5))),st.sv);evEnd()}}
 for(const k of ['cn','un','sh'])if(st[k]>0){st[k]-=dt;if(st[k]<=0){st[k]=0;evEnd()}}
 if(st.hyp>0||st.cn>0||st.un>0||st.sh>0||!(V.c4&&V.syn))return;
 if(st.nh<0)st.nh=40+R()*20;st.nh-=dt;if(st.nh<=0)evStart()}
function update(dt){
 if(st.over)return;if(st.bt>0)st.bt-=dt;tip('s0','점선 칸을 눌러 시설을 설치하고, 위쪽 버튼으로 포도당을 사 넣어 보세요!');if(nhc()>=8)tip('jam','NADH가 가득 차면 NAD⁺가 모자라 반응이 멈춰요.');ang+=dt;stuckTick(dt);progTick();if(st.coin<4)tip('low','코인이 거의 없어요! 포도당(2코인)을 사 넣어 ATP를 만들고, 의뢰를 납품해 코인을 벌어요.');spT-=dt;st.T+=dt;ordTick(dt);hypTick(dt);
 if(A.g&&on.g&&st.sh<=0&&st.glu<1&&E.filter(e=>e.k=='glu'&&!e.use).length<1&&st.coin>=2){st.coin-=2;st.glu++}
 if(A.o&&on.o&&st.hyp<=0&&st.o2+st.pend<5&&st.coin>=3){st.coin-=3;buyO2(5,5)}
 if(!anox()){st.nad=6;for(const e of E)if(e.cy&&!e.use&&(e.k=='pyr'||e.k=='nadh')){e.cy=0;if(e.k=='pyr'){e.p=[[300,138],[345,172],[372,250]];e.d=pyrD}else{e.p=[[250,235],[360,238],[400,195],[400,178]];e.d=nadhD}}}
 if(V.ferm&&anox()){fm.t-=dt;if(fm.t<=0){const p=E.find(e=>e.k=='pyr'&&e.cy&&!e.use),n=E.find(e=>e.k=='nadh'&&e.cy&&!e.use);if(p&&n){fm.t=.7;p.use=n.use=1;[p,n].forEach(q=>{q.p=[[150,335]];q.v=90});n.d=q=>{q.k='nad';fx(150,335);q.p=[[130,140]];q.d=r=>{st.nad=Math.min(6,st.nad+1);r.dead=1}};p.d=q=>{q.dead=1;fx(150,335);const lac=st.fk=='젖산';add(lac?'lac':'eth',150,335,[[150,392],[40,392],[-30,392]],60,kill);if(!lac)add('co2',160,335,[[160,-10]],45,kill);st.fer++}}}}

DEC.forEach((d,i)=>$('d'+i).onclick=()=>{if(!sel||!V[sel])return;const c=DC[sel]||(DC[sel]={own:{},t:'',f:''});if(!c.own[d[0]]){if(st.coin>=d[2]){st.coin-=d[2];c.own[d[0]]=1;c[d[3]]=d[0]}}else c[d[3]]=c[d[3]]==d[0]?'':d[0]});
$('ag').onclick=()=>{if(!A.g){if(st.coin>=40){st.coin-=40;A.g=1}}else on.g=!on.g};
$('ao').onclick=()=>{if(!A.o){if(st.coin>=30){st.coin-=30;A.o=1}}else on.o=!on.o};
$('px').onclick=()=>sel=null;
$('pu').onclick=()=>{if(sel!='syn'||!V.syn||st.sl>=5)return;const c=SUC[st.sl-1];if(st.coin>=c){st.coin-=c;st.sl++;tip('up','합성효소가 더 빨라졌어요! H⁺가 통로를 지나는 속도가 올라가요.')}};
$('ord').onpointerdown=ev=>{const b=ev.target.closest('button');if(!b||st.over)return;const o=st.ord.find(x=>x.id==+b.dataset.id);if(o&&st.atp>=o.amt){st.atp-=o.amt;st.coin+=Math.round(o.amt*1.5);tip('dl','첫 납품 성공! ATP는 세포의 에너지 화폐예요.');st.ord=st.ord.filter(x=>x!==o);}};
let rsA=0;$('rs').onclick=()=>{if(rsA){location.reload();return}rsA=1;$('rs').textContent='한 번 더 누르면 처음부터';setTimeout(()=>{rsA=0;$('rs').textContent='다시 시작'},3000)};
$('bs').onclick=()=>{st.sp=st.sp==1?3:1;$('bs').textContent='배속 x'+st.sp};
buildBG();requestAnimationFrame(loop);
</script>
</body>
